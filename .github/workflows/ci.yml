name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  composer:
    name: Install PHP dependencies
    runs-on: ubuntu-latest
    container:
      image: joomlaprojects/docker-images:php8.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-php
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
      - name: Install PHP dependencies
        if: steps.cache-php.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          composer validate --no-check-all --no-check-publish
          composer install --no-progress --ignore-platform-reqs

  code-style:
    name: Code style
    runs-on: ubuntu-latest
    needs: [composer]
    container:
      image: joomlaprojects/docker-images:php8.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true
      - name: Run PHP CS Fixer
        run: ./vendor/bin/php-cs-fixer fix -vvv --dry-run --diff

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 11 needs PHP 8.2 or later.
        php-version: ['8.2', '8.3', '8.4', '8.5']
    container:
      image: joomlaprojects/docker-images:php${{ matrix.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true
      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --display-skipped

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [composer]
    container:
      image: joomlaprojects/docker-images:php8.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true
      - name: Build
        run: |
          vendor/bin/robo build
          ls dist/*.zip
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jedchecker-package
          path: dist/*.zip
          retention-days: 7

  phpstan:
    name: PHPStan (Joomla ${{ matrix.joomla-version }})
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      fail-fast: false
      matrix:
        joomla-version: ['5.4', '6.0', '6.1', '6.2']
    container:
      image: joomlaprojects/docker-images:php8.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          fail-on-cache-miss: true

      - name: Determine download URL for Joomla ${{ matrix.joomla-version }}
        id: joomla-info
        env:
          GH_TOKEN: ${{ github.token }}
          JOOMLA_VERSION: ${{ matrix.joomla-version }}
        run: |
          # Latest stable full package of this minor version (releases are listed newest first).
          PATTERN="Joomla_${JOOMLA_VERSION//./\\.}\.[0-9]+-Stable-Full_Package\.zip"
          URL=$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/joomla/joomla-cms/releases?per_page=100" | \
                grep -oE "\"browser_download_url\":\s*\"[^\"]*/${PATTERN}\"" | \
                sed -E 's/"browser_download_url":\s*"//;s/"$//' | \
                head -1)

          if [ -z "$URL" ]; then
            echo "::error::Could not find a stable full package for Joomla ${JOOMLA_VERSION} in joomla/joomla-cms releases."
            exit 1
          fi
          echo "Joomla ${JOOMLA_VERSION} URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "url_hash=$(echo -n "$URL" | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache Joomla package
        id: cache-joomla
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: joomla.zip
          key: joomla-core-${{ matrix.joomla-version }}-${{ steps.joomla-info.outputs.url_hash }}

      - name: Download Joomla ${{ matrix.joomla-version }}
        if: steps.cache-joomla.outputs.cache-hit != 'true'
        run: curl -LfsS "${{ steps.joomla-info.outputs.url }}" -o joomla.zip

      - name: Unpack Joomla
        run: |
          unzip -tq joomla.zip
          unzip -q joomla.zip -d joomla

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
